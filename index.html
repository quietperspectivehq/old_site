<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Quiet Perspective</title>
    <link rel="icon" type="image/png" href="images/quiet_perspective_logo_1024x1024.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Thoughtful words on gratitude, fairness, resilience, and everyday life.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://quietperspectivehq.github.io">

    <!-- Author Information -->
    <meta name="author" content="Quiet Perspective">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Quiet Perspective">
    <meta property="og:description" content="Thoughtful words on gratitude, fairness, resilience, and everyday life.">
    <meta property="og:url" content="https://quietperspectivehq.github.io">
    <meta property="og:image" content="https://github.io/images/quiet_perspective_logo_1024x1024.png">
    <meta name="twitter:card" content="summary">
    -->

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
             <img class="avatar avatar--rounded" src="images/quiet_perspective_logo_1024x1024.png" alt="Quiet Perspective" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Quiet Perspective</h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Thoughtful words on gratitude, fairness, resilience, and everyday life.</p>

            <!-- All your buttons go here -->
            <nav class="button-stack" aria-label="Links">

              <!-- Discord -->
              <a class="button button-discord" href="https://discord.gg" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo">Discord Server • Free to join</a>

              <!-- Telegram -->
              <a class="button button-telegram" href="https://t.me" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram Logo">Telegram</a>

              <!-- Mastodon.social -->
              <a class="button button-mastodon" href="https://mastodon.social" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/mastodon.svg" alt="Mastodon Logo">Mastodon.social</a>

              <!-- Bluesky -->
              <a class="button button-bluesky" href="https://bsky.app" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/bluesky.svg" alt="Bluesky Logo">Bluesky</a>

              <!-- Tumblr -->
              <a class="button button-tumblr" href="https://tumblr.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/tumblr.svg" alt="Tumblr Logo">Tumblr</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://instagram.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- YouTube -->
              <a class="button button-youtube" href="https://youtube.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a>

              <!-- Pxlmo (Pixelfed) -->
              <a class="button button-pixelfed" href="https://pxlmo.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/pixelfed.svg" alt="Pixelfed Logo">Pxlmo (Pixelfed)</a>

              <!-- Pixelfed.social (Pixelfed) -->
              <a class="button button-pixelfed" href="https://pixelfed.social" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/pixelfed.svg" alt="Pixelfed Logo">Pixelfed.social (Pixelfed)</a>


      </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
